name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            clickclack:latest
            clickclack:${{ github.sha }}
          build-args: |
            CLICKCLACK_WEB_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          config: |
            Host vps-nova
              HostName ${{ secrets.VPS_HOST }}
              User ${{ secrets.VPS_USER }}
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no

      - name: Ship image to VPS
        run: docker save clickclack:latest | gzip | ssh vps-nova 'gunzip | docker load'

      - name: Restart on VPS
        run: |
          ssh vps-nova bash << 'EOF'
          set -e
          cd /opt/clickclack
          grep -q "image: clickclack:" docker-compose.yml && \
            sed -i "s|image: clickclack:.*|image: clickclack:latest|" docker-compose.yml || true
          docker compose up -d --no-deps clickclack
          echo "Deployed clickclack:latest"
          docker ps --filter name=clickclack --format "table {{.Image}}\t{{.Status}}"
          EOF
