name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/grupototum/totum-chat
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            CLICKCLACK_WEB_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          config: |
            Host vps-nova
              HostName ${{ secrets.VPS_HOST }}
              User ${{ secrets.VPS_USER }}
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no

      - name: Deploy to VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}:latest
        run: |
          ssh vps-nova bash << REMOTE
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker pull "$DEPLOY_IMAGE"
          cd /opt/clickclack
          grep -q "image: clickclack:" docker-compose.yml && \
            sed -i "s|image: clickclack:.*|image: $DEPLOY_IMAGE|" docker-compose.yml || true
          docker compose up -d --no-deps clickclack
          docker logout ghcr.io
          echo "Deployed: $DEPLOY_IMAGE"
          docker ps --filter name=clickclack --format "table {{.Image}}\t{{.Status}}"
          REMOTE

