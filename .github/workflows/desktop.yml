name: desktop

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      signing_qualification_sha:
        description: "Full reviewed commit SHA to qualify with real Windows signing (blank skips)"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26"
  PNPM_VERSION: "12.7.0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Desktop
            os: xcode-27
            command: dist:mac
            artifact: ClickClack-macOS
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Windows Desktop
            os: windows-latest
            command: dist:win
            artifact: ClickClack-Windows
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
          - name: Linux Desktop
            os: ubuntu-latest
            command: dist:linux
            artifact: ClickClack-Linux
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Intel tools on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop contract
        run: pnpm test:desktop

      - name: Typecheck desktop
        run: pnpm --filter @clickclack/desktop typecheck

      - name: Package desktop app
        run: pnpm --filter @clickclack/desktop run ${{ matrix.command }}

      - name: Verify Windows release checks reject unsigned previews
        if: matrix.command == 'dist:win'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $vendorElevate = node -e 'const r = require("node:module").createRequire(require.resolve("electron-builder")); r("app-builder-lib/out/toolsets/windows").getNsisElevatePath().then(p => console.log(p));'
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the pinned NSIS vendor helper." }
          ./scripts/windows-signing.test.ps1 -UnsignedReleaseDirectory release -Version 0.0.0 -VendorElevate $vendorElevate

      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  signing-qualification:
    name: Qualify Windows Foundation signing
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.signing_qualification_sha != '' &&
      inputs.signing_qualification_sha == github.sha
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out reviewed qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require Windows signing identity
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          . "$env:GITHUB_WORKSPACE/apps/desktop/scripts/verify-windows-release.ps1"
          Assert-WindowsSigningInputs

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop contract
        run: pnpm test:desktop

      - name: Typecheck desktop
        run: pnpm --filter @clickclack/desktop typecheck

      - name: Build desktop app
        run: pnpm --filter @clickclack/desktop build

      # TrustedSigning's DefaultAzureCredential consumes this Azure CLI session.
      - name: Authenticate Windows signer with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package desktop installers
        run: pnpm --filter @clickclack/desktop exec electron-builder --win nsis zip --x64 --config electron-builder.windows-release.yml --config.extraMetadata.version=0.0.0-qualification --publish never

      - name: Verify signed Windows release assets
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $vendorElevate = node -e 'const r = require("node:module").createRequire(require.resolve("electron-builder")); r("app-builder-lib/out/toolsets/windows").getNsisElevatePath().then(p => console.log(p));'
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the pinned NSIS vendor helper." }
          & "$env:GITHUB_WORKSPACE/apps/desktop/scripts/verify-windows-release.ps1" -Version '0.0.0-qualification' -ReleaseDirectory release -VendorElevate $vendorElevate

      - name: Write desktop checksums
        run: node apps/desktop/scripts/release-artifacts.mjs win 0.0.0-qualification apps/desktop/release

      - name: Upload desktop release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClickClack-signing-qualification-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/ClickClack-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
