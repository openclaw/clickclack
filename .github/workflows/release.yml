name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.9.0"

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      date: ${{ steps.release.outputs.date }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release refs
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Verify tag is reachable from origin/main
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Release tag must be semantic version vMAJOR.MINOR.PATCH: %s\n' "$RELEASE_TAG" >&2
            exit 64
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_REF_PROTECTED" == "true" ]] || {
              printf 'Manual releases must run from protected main.\n' >&2
              exit 1
            }
          fi
          git fetch --force --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            printf 'Release tag %s is not reachable from origin/main.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          build_date="$(git show -s --format=%cI "$commit")"
          [[ "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          {
            printf 'commit=%s\n' "$commit"
            printf 'date=%s\n' "$build_date"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
          } >>"$GITHUB_OUTPUT"

      - name: Refuse to mutate a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/release.json"
          error="$RUNNER_TEMP/release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$response" 2>"$error"; then
            jq -e '.draft == true' "$response" >/dev/null || {
              printf 'Release %s is already published and immutable.\n' "$RELEASE_TAG" >&2
              exit 1
            }
          elif grep -q 'HTTP 404' "$error"; then
            :
          else
            cat "$error" >&2
            exit 1
          fi

  release:
    name: Build server release
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-tag.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local gate
        run: pnpm check

      - name: Set web asset version
        env:
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: echo "CLICKCLACK_WEB_VERSION=$RELEASE_VERSION" >>"$GITHUB_ENV"

      - name: Build GoReleaser candidates
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.16.0"
          args: release --clean --skip=publish

      - name: Upload server release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClickClack-server
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/sha256sums.txt
            dist/CHANGELOG.md
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: ${{ matrix.name }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Desktop
            os: macos-latest
            platform: mac
            builder_args: --mac dmg zip --x64 --arm64
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Windows Desktop
            os: windows-latest
            platform: win
            builder_args: --win nsis zip --x64
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
          - name: Linux Desktop
            os: ubuntu-latest
            platform: linux
            builder_args: --linux AppImage deb --x64
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ needs.verify-tag.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop contract
        run: pnpm test:desktop

      - name: Typecheck desktop
        run: pnpm --filter @clickclack/desktop typecheck

      - name: Build desktop app
        run: pnpm --filter @clickclack/desktop build

      - name: Package desktop installers
        run: pnpm --filter @clickclack/desktop exec electron-builder ${{ matrix.builder_args }} --config.extraMetadata.version=${{ needs.verify-tag.outputs.version }} --publish never

      - name: Write desktop checksums
        run: node apps/desktop/scripts/release-artifacts.mjs ${{ matrix.platform }} ${{ needs.verify-tag.outputs.version }} apps/desktop/release

      - name: Upload desktop release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClickClack-desktop-${{ matrix.platform }}
          path: |
            ${{ matrix.files }}
            apps/desktop/release/ClickClack-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable release
    needs:
      - verify-tag
      - release
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download server release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ClickClack-server
          path: server-release

      - name: Download desktop release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ClickClack-desktop-*
          path: desktop-release
          merge-multiple: true

      - name: Verify candidate checksums and unique names
        shell: bash
        run: |
          set -euo pipefail
          (cd server-release && sha256sum --check sha256sums.txt)
          (cd desktop-release && sha256sum --check ClickClack-*-SHA256SUMS.txt)
          declare -A names=()
          while IFS= read -r -d '' candidate; do
            name="${candidate##*/}"
            [[ -z "${names[$name]:-}" ]] || {
              printf 'Duplicate release asset name: %s\n' "$name" >&2
              exit 1
            }
            names[$name]=1
          done < <(
            find server-release desktop-release -maxdepth 1 -type f \
              ! -name CHANGELOG.md -print0
          )

      - name: Create or reuse the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/release.json"
          error="$RUNNER_TEMP/release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$response" 2>"$error"; then
            jq -e '.draft == true' "$response" >/dev/null || {
              printf 'Release %s became published before upload; refusing mutation.\n' "$RELEASE_TAG" >&2
              exit 1
            }
            jq -rj '.body // ""' "$response" >"$RUNNER_TEMP/existing-release-notes.md"
            cmp -s server-release/CHANGELOG.md "$RUNNER_TEMP/existing-release-notes.md" || {
              printf 'Draft release notes differ from the verified candidate; refusing replacement.\n' >&2
              exit 1
            }
          elif grep -q 'HTTP 404' "$error"; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --notes-file server-release/CHANGELOG.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --verify-tag
          else
            cat "$error" >&2
            exit 1
          fi

      - name: Upload only missing or byte-identical draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          verify_dir="$RUNNER_TEMP/verified-assets"
          mkdir -p "$verify_dir"

          refresh_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_json"
            jq -e '.draft == true' "$release_json" >/dev/null || {
              printf 'Release %s is published; refusing asset mutation.\n' "$RELEASE_TAG" >&2
              exit 1
            }
          }

          upload_asset() {
            local candidate=$1
            local name="${candidate##*/}"
            local count asset_id existing
            refresh_release
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
            [[ "$count" == "0" || "$count" == "1" ]]
            if [[ "$count" == "1" ]]; then
              asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$release_json")"
              existing="$verify_dir/$name"
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >"$existing"
              cmp -s "$candidate" "$existing" || {
                printf 'Draft asset %s exists with different bytes; refusing replacement.\n' "$name" >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$candidate" --repo "$GITHUB_REPOSITORY"
            fi
          }

          while IFS= read -r -d '' candidate; do
            upload_asset "$candidate"
          done < <(
            find server-release desktop-release -maxdepth 1 -type f \
              ! -name CHANGELOG.md -print0
          )

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == true) | .id' | grep -Eq '^[0-9]+$'
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
