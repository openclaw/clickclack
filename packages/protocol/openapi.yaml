openapi: 3.1.0
info:
  title: ClickClack API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Database readiness
      security: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          description: Database is unavailable; internal error details are omitted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: unavailable
  /metrics:
    get:
      operationId: getMetrics
      summary: Opt-in metadata-only Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition when metrics are enabled
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled
  /api/auth/magic/request:
    post:
      operationId: requestMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestMagicLinkRequest"
      responses:
        "201":
          description: Created local magic-link token in dev-bootstrap mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResponse"
        "403":
          description: Dev-bootstrap token minting requires a loopback client and local request host
        "501":
          description: Magic-link delivery is not configured
  /api/auth/magic/consume:
    post:
      operationId: consumeMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeMagicLinkRequest"
      responses:
        "200":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /api/auth/github/start:
    get:
      operationId: startGitHubOAuth
      security: []
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization
        "501":
          description: GitHub OAuth not configured
  /api/auth/github/desktop/start:
    get:
      operationId: startDesktopGitHubOAuth
      security: []
      parameters:
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "302":
          description: Redirect the system browser to GitHub OAuth authorization
        "400":
          description: Invalid desktop code challenge
        "501":
          description: GitHub OAuth not configured
  /api/auth/github/desktop/consume:
    post:
      operationId: consumeDesktopGitHubOAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeDesktopGitHubOAuthRequest"
      responses:
        "200":
          description: One-time desktop grant consumed and session cookie created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid, expired, or previously consumed desktop grant
        "403":
          description: Cross-site redemption rejected
  /api/auth/github/callback:
    get:
      operationId: finishGitHubOAuth
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Session created and redirected to the web app or desktop callback
        "400":
          description: Invalid OAuth callback
        "403":
          description: GitHub account is not allowed
  /api/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
  /api/me/bots:
    get:
      operationId: listMyBots
      responses:
        "200":
          description: User-owned bots installed in workspaces
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnedBotEntry"
        "403":
          description: Bot tokens cannot list owned bots
  /api/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
  /api/routes/{workspace_route_id}/{target_route_id}:
    get:
      operationId: resolveRoute
      parameters:
        - $ref: "#/components/parameters/workspace_route_id"
        - $ref: "#/components/parameters/target_route_id"
      responses:
        "200":
          description: Resolved route target and canonical public URL path
          content:
            application/json:
              schema:
                type: object
                required: [route]
                properties:
                  route:
                    $ref: "#/components/schemas/RouteTarget"
        "404":
          description: Route was missing or inaccessible
  /api/workspaces/{workspace_id}:
    get:
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Updated workspace profile
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  event:
                    $ref: "#/components/schemas/Event"
        "403":
          description: Workspace manager permission required
    delete:
      operationId: deleteWorkspace
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "204":
          description: Workspace metadata deleted; queued upload-object cleanup may continue asynchronously
        "403":
          description: Workspace owner permission required
  /api/workspaces/{workspace_id}/transfer-ownership:
    post:
      operationId: transferWorkspaceOwnership
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferWorkspaceOwnershipRequest"
      responses:
        "200":
          description: Workspace ownership transferred
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  event:
                    $ref: "#/components/schemas/Event"
        "403":
          description: Workspace owner permission required
  /api/workspaces/{workspace_id}/members:
    get:
      operationId: listWorkspaceMembers
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, moderator, member, bot, guest]
      responses:
        "200":
          description: Paginated workspace members visible to any workspace member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberPage"
  /api/workspaces/{workspace_id}/moderation/members:
    get:
      operationId: listWorkspaceMembersForModeration
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Workspace members with moderation state
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberModeration"
  /api/workspaces/{workspace_id}/moderation/members/{user_id}:
    patch:
      operationId: updateWorkspaceMemberModeration
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberModerationRequest"
      responses:
        "200":
          description: Updated member moderation state
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/MemberModeration"
                  event:
                    $ref: "#/components/schemas/Event"
  /api/workspaces/{workspace_id}/channels:
    get:
      operationId: listChannels
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResponse"
    post:
      operationId: createChannel
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMutationResponse"
  /api/workspaces/{workspace_id}/topics:
    get:
      operationId: listTopics
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Workspace topics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicListResponse"
    post:
      operationId: createTopic
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "201":
          description: Created topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResponse"
  /api/workspaces/{workspace_id}/bots:
    get:
      operationId: listBots
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Workspace bot identities and redacted tokens
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotWithTokens"
    post:
      operationId: createBot
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
      responses:
        "201":
          description: Created bot and one-time raw bot token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBotResponse"
        "403":
          description: Service bots require a workspace manager. User-owned bots must be created by their owner.
  /api/workspaces/{workspace_id}/bots/{bot_user_id}/membership:
    delete:
      operationId: removeBotFromWorkspace
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: bot_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Bot removed from workspace and workspace-scoped tokens revoked
        "403":
          description: Workspace manager permission required
        "404":
          description: Bot membership not found
  /api/workspaces/{workspace_id}/bots/{bot_user_id}/tokens:
    get:
      operationId: listWorkspaceBotTokens
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: bot_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted workspace-scoped bot tokens
          content:
            application/json:
              schema:
                type: object
                required: [bot_tokens]
                properties:
                  bot_tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotToken"
        "403":
          description: Workspace membership required
    post:
      operationId: createWorkspaceBotToken
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: bot_user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotTokenRequest"
      responses:
        "201":
          description: Created one-time raw workspace-scoped bot token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotTokenResponse"
        "403":
          description: Service bot tokens require a workspace manager. User-owned bot tokens require the bot owner.
  /api/bots/{bot_user_id}/tokens:
    get:
      operationId: listBotTokens
      parameters:
        - name: bot_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted bot tokens for bots installed in exactly one workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotTokenListResponse"
        "403":
          description: Workspace membership required
    post:
      operationId: createBotToken
      parameters:
        - name: bot_user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotTokenRequest"
      responses:
        "201":
          description: Created one-time raw bot token for bots installed in exactly one workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotTokenResponse"
        "403":
          description: Service bot tokens require a workspace manager. User-owned bot tokens require the bot owner.
  /api/bot-tokens/{token_id}/revoke:
    post:
      operationId: revokeBotToken
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked bot token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotTokenResponse"
        "403":
          description: Service bot tokens require a workspace manager. User-owned bot tokens require the bot owner.
  /api/workspaces/{workspace_id}/app-installations:
    get:
      operationId: listAppInstallations
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Active app installations for a workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallationListResponse"
    post:
      operationId: createAppInstallation
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppInstallationRequest"
      responses:
        "201":
          description: Installed app binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallationResponse"
  /api/app-installations/{installation_id}/revoke:
    post:
      operationId: revokeAppInstallation
      parameters:
        - name: installation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked app installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallationResponse"
  /api/workspaces/{workspace_id}/slash-commands:
    get:
      operationId: listSlashCommands
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Active registered slash commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashCommandListResponse"
    post:
      operationId: createSlashCommand
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSlashCommandRequest"
      responses:
        "201":
          description: Registered slash command and one-time signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashCommandResponse"
  /api/slash-commands/{command_id}/revoke:
    post:
      operationId: revokeSlashCommand
      parameters:
        - name: command_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked slash command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashCommandResponse"
  /api/workspaces/{workspace_id}/event-subscriptions:
    get:
      operationId: listEventSubscriptions
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Active outgoing event subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscriptionListResponse"
    post:
      operationId: createEventSubscription
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventSubscriptionRequest"
      responses:
        "201":
          description: Created event subscription and one-time signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscriptionResponse"
  /api/event-subscriptions/{subscription_id}/revoke:
    post:
      operationId: revokeEventSubscription
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked event subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscriptionResponse"
  /api/event-subscriptions/{subscription_id}/deliveries:
    get:
      operationId: listEventDeliveryAttempts
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDeliveryAttemptListResponse"
  /api/workspaces/{workspace_id}/audit-log:
    get:
      operationId: listAuditLogEntries
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Workspace audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
  /api/workspaces/{workspace_id}/connected-accounts:
    get:
      operationId: listConnectedAccounts
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      responses:
        "200":
          description: Active connected accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountListResponse"
    post:
      operationId: createConnectedAccount
      parameters:
        - $ref: "#/components/parameters/workspace_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectedAccountRequest"
      responses:
        "201":
          description: Created connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountResponse"
  /api/connected-accounts/{account_id}/revoke:
    post:
      operationId: revokeConnectedAccount
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountResponse"
  /api/channels/{channel_id}:
    patch:
      operationId: updateChannel
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMutationResponse"
  /api/channels/{channel_id}/messages:
    get:
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: before_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: around_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Root channel messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
    post:
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: Existing message returned for an idempotent nonce replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
  /api/channels/{channel_id}/read:
    post:
      operationId: markChannelRead
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Updated channel read receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceiptResponse"
  /api/messages/{message_id}:
    get:
      operationId: getMessage
      parameters:
        - $ref: "#/components/parameters/message_id"
      responses:
        "200":
          description: Message visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    patch:
      operationId: updateMessage
      parameters:
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMessageRequest"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
    delete:
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/message_id"
      responses:
        "200":
          description: Soft-deleted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
  /api/messages/{message_id}/thread:
    get:
      operationId: getThread
      parameters:
        - $ref: "#/components/parameters/message_id"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Thread root and replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadResponse"
  /api/messages/{message_id}/thread/replies:
    post:
      operationId: createThreadReply
      parameters:
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadReplyRequest"
      responses:
        "200":
          description: Existing thread reply returned for an idempotent nonce replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadReplyResponse"
        "201":
          description: Created thread reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadReplyResponse"
  /api/messages/{message_id}/reactions:
    post:
      operationId: addReaction
      parameters:
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReactionRequest"
      responses:
        "200":
          description: Reaction already existed; no event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
        "201":
          description: Added reaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
  /api/messages/{message_id}/attachments:
    post:
      operationId: attachUpload
      parameters:
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachUploadRequest"
      responses:
        "200":
          description: Attached upload to message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/messages/{message_id}/reactions/{emoji}:
    delete:
      operationId: removeReaction
      parameters:
        - $ref: "#/components/parameters/message_id"
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed reaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
  /api/realtime/events:
    get:
      operationId: listEvents
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: after_cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: include_tail
          in: query
          description: Include the latest durable cursor visible at request start.
          schema:
            type: boolean
      responses:
        "200":
          description: Durable events after cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
  /api/realtime/ephemeral:
    post:
      operationId: publishEphemeral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EphemeralEventRequest"
      responses:
        "202":
          description: Ephemeral event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
  /api/realtime/ws:
    get:
      operationId: realtimeWebSocket
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: after_cursor
          in: query
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade
  /api/search:
    get:
      operationId: search
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /api/uploads:
    post:
      operationId: createUpload
      parameters:
        - name: workspace_id
          in: query
          description: Optional workspace id for multipart clients that cannot send fields before the file part. If omitted, workspace_id must be included as a form field before file.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                workspace_id:
                  type: string
                  description: Workspace id. Required when the workspace_id query parameter is omitted.
                file:
                  type: string
                  format: binary
                width:
                  type: integer
                  minimum: 0
                height:
                  type: integer
                  minimum: 0
                duration_ms:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Created upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /api/uploads/{upload_id}:
    get:
      operationId: getUpload
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upload bytes
  /api/dms:
    get:
      operationId: listDirectConversations
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DM list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversationListResponse"
    post:
      operationId: createDirectConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectConversationRequest"
      responses:
        "201":
          description: Created DM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversationResponse"
  /api/dms/{conversation_id}:
    get:
      operationId: getDirectConversation
      parameters:
        - $ref: "#/components/parameters/conversation_id"
      responses:
        "200":
          description: Direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversationResponse"
    delete:
      operationId: hideDirectConversation
      parameters:
        - $ref: "#/components/parameters/conversation_id"
      responses:
        "200":
          description: Closed direct conversation for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/dms/{conversation_id}/open:
    post:
      operationId: reopenDirectConversation
      parameters:
        - $ref: "#/components/parameters/conversation_id"
      responses:
        "200":
          description: Reopened direct conversation for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectConversationResponse"
  /api/dms/{conversation_id}/messages:
    get:
      operationId: listDirectMessages
      parameters:
        - $ref: "#/components/parameters/conversation_id"
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: before_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: around_seq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Direct messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
    post:
      operationId: createDirectMessage
      parameters:
        - $ref: "#/components/parameters/conversation_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: Existing direct message returned for an idempotent nonce replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
        "201":
          description: Created direct message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
  /api/dms/{conversation_id}/read:
    post:
      operationId: markDirectRead
      parameters:
        - $ref: "#/components/parameters/conversation_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Updated direct-conversation read receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceiptResponse"
  /api/hooks/mattermost/{channel_id}:
    post:
      operationId: mattermostIncomingWebhook
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MattermostWebhookRequest"
      responses:
        "201":
          description: Created message from incoming webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResponse"
  /api/hooks/slash/{channel_id}:
    post:
      operationId: slashCommand
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SlashCommandRequest"
      responses:
        "200":
          description: Registered slash-command callback response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashCommandCallbackResponse"
        "201":
          description: Slash-command callback response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashCommandCallbackResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ClickClack token
      description: Use an sst_ human session token or a scoped ccb_ bot token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cc_session
      description: Browser session cookie set by magic-link or GitHub OAuth login.
  parameters:
    workspace_id:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    channel_id:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
    message_id:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    conversation_id:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    workspace_route_id:
      name: workspace_route_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^(T[A-Z0-9]{16}|wsp_[A-Za-z0-9-]+)$"
    target_route_id:
      name: target_route_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^([CDM][A-Z0-9]{16}|(chn|dm|msg)_[A-Za-z0-9-]+)$"
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    MagicLink:
      type: object
      required: [id, email, display_name, created_at, expires_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
    MagicLinkResponse:
      type: object
      required: [magic_link, token]
      properties:
        magic_link:
          $ref: "#/components/schemas/MagicLink"
        token:
          type: string
          description: One-time mgt_ magic-link token.
          pattern: "^mgt_"
    Session:
      type: object
      required: [id, token, user_id, created_at, expires_at]
      properties:
        id:
          type: string
          description: Persisted session record ID.
          pattern: "^ses_"
        token:
          type: string
          description: Bearer session token returned only when the session is created.
          pattern: "^sst_"
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    AuthSessionResponse:
      type: object
      required: [user, session, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: Same sst_ bearer token as session.token.
          pattern: "^sst_"
    WorkspaceListResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
    ChannelListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ChannelMutationResponse:
      type: object
      required: [channel, event]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        event:
          $ref: "#/components/schemas/Event"
    TopicListResponse:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
    TopicResponse:
      type: object
      required: [topic]
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
    AppInstallationListResponse:
      type: object
      required: [app_installations]
      properties:
        app_installations:
          type: array
          items:
            $ref: "#/components/schemas/AppInstallation"
    AppInstallationResponse:
      type: object
      required: [app_installation]
      properties:
        app_installation:
          $ref: "#/components/schemas/AppInstallation"
    SlashCommandListResponse:
      type: object
      required: [slash_commands]
      properties:
        slash_commands:
          type: array
          items:
            $ref: "#/components/schemas/SlashCommand"
    SlashCommandResponse:
      type: object
      required: [slash_command]
      properties:
        slash_command:
          $ref: "#/components/schemas/SlashCommand"
    EventSubscriptionListResponse:
      type: object
      required: [event_subscriptions]
      properties:
        event_subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/EventSubscription"
    EventSubscriptionResponse:
      type: object
      required: [event_subscription]
      properties:
        event_subscription:
          $ref: "#/components/schemas/EventSubscription"
    EventDeliveryAttemptListResponse:
      type: object
      required: [event_delivery_attempts]
      properties:
        event_delivery_attempts:
          type: array
          items:
            $ref: "#/components/schemas/EventDeliveryAttempt"
    AuditLogListResponse:
      type: object
      required: [audit_log_entries]
      properties:
        audit_log_entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
    ConnectedAccountListResponse:
      type: object
      required: [connected_accounts]
      properties:
        connected_accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccount"
    ConnectedAccountResponse:
      type: object
      required: [connected_account]
      properties:
        connected_account:
          $ref: "#/components/schemas/ConnectedAccount"
    MessagePage:
      type: object
      required: [messages, oldest_seq, newest_seq, has_older, has_newer]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        oldest_seq:
          type: integer
          format: int64
        newest_seq:
          type: integer
          format: int64
        has_older:
          type: boolean
        has_newer:
          type: boolean
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    MessageMutationResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        event:
          $ref: "#/components/schemas/Event"
    ThreadResponse:
      type: object
      required: [root, replies, thread_state]
      properties:
        root:
          $ref: "#/components/schemas/Message"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        thread_state:
          $ref: "#/components/schemas/ThreadState"
    ThreadReplyResponse:
      type: object
      required: [message, thread_state, events]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        thread_state:
          $ref: "#/components/schemas/ThreadState"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
    EventMutationResponse:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/Event"
    ReadReceiptResponse:
      type: object
      required: [receipt]
      properties:
        receipt:
          $ref: "#/components/schemas/ReadReceipt"
    EventListResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        tail_cursor:
          type: string
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    UploadResponse:
      type: object
      required: [upload]
      properties:
        upload:
          $ref: "#/components/schemas/Upload"
    DirectConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/DirectConversation"
    DirectConversationResponse:
      type: object
      required: [conversation]
      properties:
        conversation:
          $ref: "#/components/schemas/DirectConversation"
    SlashCommandCallbackResponse:
      type: object
      required: [response_type, text, message, event]
      properties:
        response_type:
          type: string
        text:
          type: string
        message:
          $ref: "#/components/schemas/Message"
        event:
          $ref: "#/components/schemas/Event"
        invocation:
          $ref: "#/components/schemas/SlashCommandInvocation"
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
    UpdateMemberModerationRequest:
      type: object
      properties:
        role:
          type: string
          enum: [moderator, member, guest]
        timeout_until:
          type: string
          format: date-time
        timeout_minutes:
          type: integer
        clear_timeout:
          type: boolean
        blocked:
          type: boolean
        moderation_note:
          type: string
    RequestMagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
    ConsumeMagicLinkRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ConsumeDesktopGitHubOAuthRequest:
      type: object
      required: [code, code_verifier]
      properties:
        code:
          type: string
          minLength: 32
          maxLength: 32
          pattern: "^[a-f0-9]+$"
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
    UpdateMeRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          maxLength: 80
        handle:
          type: string
          description: Unique user handle. Accepts an optional leading @ and stores the normalized value without it.
          pattern: "^[a-zA-Z0-9@][a-zA-Z0-9_-]{1,32}$"
        avatar_url:
          type: string
          format: uri
        notification_settings:
          $ref: "#/components/schemas/NotificationSettings"
    User:
      type: object
      required: [id, kind, display_name, handle, avatar_url, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [human, bot]
          description: Human users sign in directly. Bot users authenticate with bot tokens and may be service-owned or owned by a human.
        owner_user_id:
          type: string
          description: Human owner for a user-owned bot. Empty for humans and service bots.
        display_name:
          type: string
        handle:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        notification_settings:
          $ref: "#/components/schemas/NotificationSettings"
    BotToken:
      type: object
      required: [id, bot_user_id, workspace_id, name, scopes, created_at]
      properties:
        id:
          type: string
        bot_user_id:
          type: string
        workspace_id:
          type: string
        owner_user_id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        token:
          type: string
          description: One-time raw ccb_ token. Present only immediately after creation.
    BotWithTokens:
      type: object
      required: [bot, tokens]
      properties:
        bot:
          $ref: "#/components/schemas/User"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/BotToken"
    CreateBotResponse:
      type: object
      required: [bot, bot_token]
      properties:
        bot:
          $ref: "#/components/schemas/User"
        bot_token:
          $ref: "#/components/schemas/BotToken"
    BotTokenResponse:
      type: object
      required: [bot_token]
      properties:
        bot_token:
          $ref: "#/components/schemas/BotToken"
    BotTokenListResponse:
      type: object
      required: [bot_tokens]
      properties:
        bot_tokens:
          type: array
          items:
            $ref: "#/components/schemas/BotToken"
    OwnedBotWorkspace:
      type: object
      required: [id, route_id, name]
      properties:
        id:
          type: string
        route_id:
          type: string
        name:
          type: string
    OwnedBotEntry:
      type: object
      required: [bot, workspace, active_token_count]
      properties:
        bot:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/OwnedBotWorkspace"
        active_token_count:
          type: integer
          minimum: 0
    CreateBotRequest:
      type: object
      required: [display_name]
      properties:
        owner_user_id:
          type: string
        display_name:
          type: string
          maxLength: 80
        handle:
          type: string
        avatar_url:
          type: string
          format: uri
        token_name:
          type: string
        scopes:
          type: array
          items:
            type: string
    CreateBotTokenRequest:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    AppInstallation:
      type: object
      required: [id, workspace_id, app_slug, display_name, bot_user_id, config, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        app_slug:
          type: string
        display_name:
          type: string
        bot_user_id:
          type: string
        config:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    CreateAppInstallationRequest:
      type: object
      required: [app_slug, bot_user_id]
      properties:
        app_slug:
          type: string
        display_name:
          type: string
          maxLength: 80
        bot_user_id:
          type: string
        config:
          type: object
          additionalProperties: true
    SlashCommand:
      type: object
